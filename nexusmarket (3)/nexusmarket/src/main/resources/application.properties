spring.application.name=nexusmarket

# ---------------------------------------------------------------------------
# MySQL (business data and operations)
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexusmarket?createDatabaseIfNotExist=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# update: Hibernate creates/updates the tables from the JPA entities (development only)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# MongoDB (audit logs)  -  Spring Boot 4 uses the "spring.mongodb" prefix
# ---------------------------------------------------------------------------
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/nexusmarket}
# Spring Boot 4 requires an explicit representation for BigDecimal values (amounts in audit details)
spring.data.mongodb.representation.big-decimal=decimal128

# ---------------------------------------------------------------------------
# Security - JWT (HS256). The secret must have at least 32 characters.
# ---------------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET:nexusmarket-dev-secret-change-me-0123456789}
security.jwt.expiration-minutes=120
security.jwt.issuer=nexusmarket

# ---------------------------------------------------------------------------
# Initial administrator (created on startup when it does not exist)
# ---------------------------------------------------------------------------
nexusmarket.admin.username=${ADMIN_USERNAME:admin}
nexusmarket.admin.password=${ADMIN_PASSWORD:Admin123*}
nexusmarket.admin.identification=${ADMIN_IDENTIFICATION:1000000000}
nexusmarket.admin.full-name=NexusMarket Administrator
nexusmarket.admin.email=${ADMIN_EMAIL:admin@nexusmarket.local}
