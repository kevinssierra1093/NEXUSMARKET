# Local databases for development.
# Start:  docker compose up -d      Stop:  docker compose down
services:
  mysql:
    image: mysql:8.4
    container_name: nexusmarket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nexusmarket
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:8
    container_name: nexusmarket-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
